[project]
name = "arete"
version = "0.1.0"
description = "An intelligent training assistant powered by LLMs, RAG and personal data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.3.5",
    "duckdb>=1.4.2",
    "fastapi>=0.119.0",
    "openai>=1.82.0",
    "pydantic>=2",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arete"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.14.7",
]
# Heavy ML dependencies - install when needed: uv sync --extra ml
ml = [
    "mlflow>=3.6.0",
    "numpy>=2.3.5",
    "optuna>=4.6.0",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "scikit-learn>=1.7.2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "typer>=0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[project]
name = "arete"
version = "0.1.0"
description = "Training assistant: Garmin/Strava analytics, strength log and LLM coaching tips"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.4.2",
    "fastapi>=0.119.0",
    "fitparse>=1.2.0",
    "garminconnect>=0.3.2",
    "httpx>=0.28.0",
    "lark>=1.3.1",
    "numpy>=2.3.5",
    "openai>=1.82.0",
    "pydantic>=2",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.6",
    "text2num>=3.1.0",
    "uvicorn>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arete"]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "ruff>=0.14.7,<0.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in default argument (FastAPI pattern: Query, File, Depends)
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Batch changes daily to conserve the free router's request quota (UTC).
    - cron: "23 5 * * *"

permissions:
  contents: write
  pull-requests: write

# Both triggers maintain the same PR; never interrupt a run halfway through it.
concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check provider credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::Add the repository Actions secret OPENROUTER_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          # OpenWiki compares source evidence with its last documented commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.0"

      - name: Install OpenWiki
        timeout-minutes: 5
        # Resolve dependencies as of this OpenWiki release: newer AWS SDK
        # packages currently require credential-provider-env versions absent
        # from npm. Advance the cutoff only after a clean installation test.
        run: npm install --global --before=2026-10-07T00:00:00Z openwiki@0.7.1

      - name: Update the wiki
        timeout-minutes: 25
        # --update also bootstraps a missing wiki. Failed runs must not publish
        # partial pages or advance the successful-update metadata.
        run: openwiki code --update --print
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: openrouter/free
          OPENWIKI_MAX_OUTPUT_TOKENS: "8192"
          OPENWIKI_PAGE_CONCURRENCY: "1"
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "1"
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Check for documentation changes
        id: changes
        run: |
          rm -f -- openwiki/.run.json
          # A freshness timestamp or source fingerprint alone is not a docs PR.
          changes=$(git status --porcelain --untracked-files=all -- \
            openwiki AGENTS.md CLAUDE.md \
            ':!openwiki/.last-update.json' ':!openwiki/.page-manifest.json')
          if [[ -n "$changes" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the documentation pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          base: main
          branch: openwiki/update
          # Include grounding and freshness metadata with substantive changes;
          # never publish application or workflow edits from the model.
          add-paths: |
            openwiki/
            AGENTS.md
            CLAUDE.md
          commit-message: |
            docs: refresh the OpenWiki reference

            Keep repository context aligned with the current source so agents
            can find implementation facts and their evidence without rediscovery.
          title: "docs: refresh the OpenWiki reference"
          body: |
            Refresh the repository wiki and its source-grounded claims using
            OpenWiki 0.7.1 with OpenRouter's `openrouter/free` model router.

            Review the generated claims and source references. Approve the CI
            workflows from the PR merge box so the required checks can run.

            Generated by the [OpenWiki workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Enable merge after required checks
        if: steps.pr.outputs.pull-request-number != ''
        # Request auto-merge explicitly: `gh pr merge --auto` can merge
        # immediately when branch protection has no required checks.
        run: |
          pr_id=$(gh pr view "$PR_URL" --json id --jq .id)
          gh api graphql -f pullRequestId="$pr_id" -f query='
            mutation($pullRequestId: ID!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId, mergeMethod: MERGE
              }) { pullRequest { number } }
            }'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}

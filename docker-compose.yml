services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: arete-backend
    env_file: .env
    environment:
      - ARETE_DB=/app/data/arete.duckdb
      - ARETE_GARMIN_TOKENS_DIR=/app/data/garmin_tokens
      # The frontend container is published on 3080 (overrides .env for Docker)
      - FRONTEND_URL=http://localhost:3080
      # Daily Garmin + Strava sync at 09:00 Paris time. The image is UTC, so
      # without TZ the hour below would mean 09:00 UTC (11:00 in Paris).
      - TZ=Europe/Paris
      - ARETE_AUTO_SYNC_HOUR=9
      # Ollama running on the Docker host (default). Switch to
      # http://ollama:11434/v1 when enabling the ollama service below.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Same data directory as the dev setup: DuckDB file, Garmin tokens, FIT files
      - ./data:/app/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: arete-frontend
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Uncomment to run Ollama as a Docker service:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: arete-ollama
  #   ports:
  #     - "11434:11434"

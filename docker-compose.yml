services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: arete-backend
    env_file: .env
    environment:
      - ARETE_DB=/app/data/arete.duckdb
    volumes:
      - arete-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: arete-frontend
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arete-data:
    driver: local

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: arete-backend
    env_file: .env
    environment:
      - ARETE_DB=/app/data/arete.duckdb
      - ARETE_GARMIN_TOKENS_DIR=/app/data/garmin_tokens
      # Ollama running on the Docker host (default). Switch to
      # http://ollama:11434/v1 when enabling the ollama service below.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - arete-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: arete-frontend
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Uncomment to run Ollama as a Docker service:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: arete-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped

volumes:
  arete-data:
    driver: local
  # ollama-data:
  #   driver: local
